name: Puddle
description: >-
  Puddle is a technical-interview platform for evaluating software-engineering
  candidates in real-world, AI-enabled conditions. Candidates work through live
  coding assessments inside a sandboxed environment with an integrated IDE and
  terminal, and are free to use modern AI tools (such as Claude Code) during the
  session. Puddle captures detailed signals about how a candidate approaches a
  problem across structured phases (problem discussion, architecture,
  implementation, and debrief) and produces an outcome report with confidence
  scores, focus and iteration-pace metrics, and hiring recommendations. It is
  sold as a B2B SaaS recruitment-assessment tool via demo and early-access
  waitlist. Puddle was surfaced as an a16z portfolio company and added to the
  API Evangelist network. As of this pass Puddle publishes no public API,
  developer documentation, SDK, or OpenAPI surface; the profile below captures
  its verifiable public web and security presence.
